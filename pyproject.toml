[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppreproc-pfb"
version = "1.0.0"
description = "Versioned reference reader for the pPreProc PFB/PFC v1 format"
readme = "sdk/python/README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  {name = "Ranfei Chen"},
  {name = "Pengzhi Mao"},
  {name = "Ching Tarn"},
  {name = "Jiale Zhao"},
  {name = "Hao Chi", email = "chihao@ict.ac.cn"},
]
keywords = ["proteomics", "mass spectrometry", "PFB", "PFC", "pPreProc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/crf-pfind/pPreProc"
Repository = "https://github.com/crf-pfind/pPreProc"
Documentation = "https://ppreproc.readthedocs.io/en/latest/"
Issues = "https://github.com/crf-pfind/pPreProc/issues"
Releases = "https://github.com/crf-pfind/pPreProc/releases"

[project.scripts]
ppreproc-pfb = "ppreproc_pfb.cli:main"

[tool.setuptools]
package-dir = {"" = "sdk/python/src"}

[tool.setuptools.packages.find]
where = ["sdk/python/src"]

[tool.pytest.ini_options]
testpaths = ["sdk/python/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
