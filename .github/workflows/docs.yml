name: documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sphinx:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [en, zh-cn]
    env:
      READTHEDOCS_LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install .
      - name: Build ${{ matrix.language }} documentation
        run: >-
          sphinx-build -W --keep-going -b html
          docs build/docs/${{ matrix.language }}
