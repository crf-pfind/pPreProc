name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python tools/generate_fixture.py
      - run: python -m unittest discover -s sdk/python/tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.4
      - run: ruff check sdk/python/src sdk/python/tests tools examples/python
      - run: python tools/check_repository.py

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure C++17 reader
        run: >-
          cmake -S sdk/cpp -B build/cmake -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -pedantic"
      - name: Build C++17 reader
        run: cmake --build build/cmake --config Release
      - name: Test C++17 reader
        run: ctest --test-dir build/cmake --build-config Release --output-on-failure
