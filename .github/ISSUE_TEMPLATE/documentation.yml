name: Documentation issue
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
body:
  - type: input
    id: page
    attributes:
      label: Page or URL
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Simplified Chinese
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Quote only the smallest relevant passage.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
