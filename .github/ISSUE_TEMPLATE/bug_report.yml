name: Application bug
description: Report a reproducible problem in the pPreProc Windows application
title: "[Application]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not upload restricted vendor data, binaries, credentials, or confidential logs.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Windows edition, version, and architecture
    validations:
      required: true
  - type: input
    id: installation
    attributes:
      label: Installation method
      description: GitHub Release asset name, pFind bundle, or another method
    validations:
      required: true
  - type: textarea
    id: dataset
    attributes:
      label: Input context
      description: Vendor or format, instrument, acquisition mode, and approximate dataset size
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact command or configuration and the shortest reproducible sequence
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      render: text
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Data authorization
      options:
        - label: I am authorized to share every attachment and have removed sensitive information.
          required: true
