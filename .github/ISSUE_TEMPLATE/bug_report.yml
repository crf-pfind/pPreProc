name: Bug report
description: Report a reproducible application, SDK, CLI, or format problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not upload restricted vendor data, binaries, credentials, or confidential logs.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Windows application
        - Python SDK or CLI
        - C++ SDK
        - PFB/PFC format
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Application or SDK version and PFB/PFC format version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Environment
      description: Operating system, architecture, and Python or compiler version where applicable
    validations:
      required: true
  - type: textarea
    id: dataset
    attributes:
      label: Input context
      description: Format, instrument, acquisition mode, and approximate dataset size where relevant
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact command or configuration and the shortest reproducible sequence
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      render: text
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Data authorization
      options:
        - label: I am authorized to share every attachment and have removed sensitive information.
          required: true
