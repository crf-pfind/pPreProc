name: SDK or format bug
description: Report a reproducible Python, C++, CLI, or PFB/PFC compatibility problem
title: "[SDK]: "
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Python SDK
        - C++ SDK
        - ppreproc-pfb CLI
        - PFB/PFC specification
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: SDK version, PFB/PFC format version, Python or compiler version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer the synthetic fixture or a small shareable example
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
      render: text
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Data authorization
      options:
        - label: I am authorized to share every attachment and have removed sensitive information.
          required: true
